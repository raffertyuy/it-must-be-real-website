name: Apply verified story identity update
on:
  push:
    branches: [fix/robotic-finger-title-mom-hair]
    paths: [.github/workflows/apply-story-identity-update.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/robotic-finger-title-mom-hair
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply checksummed artwork and targeted text update
        env:
          PACKAGE_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-825c-820b-97e8-37aef113de39/raw?se=2026-10-16T07%3A54%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=7ebfb5e0-8e34-5658-b371-f7919c3bbc07&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-16T03%3A20%3A51Z&ske=2026-10-17T03%3A20%3A51Z&sks=b&skv=2026-02-06&sig=For4yu5D9gUP8EzO5X4i8ErtJBvqC7c13/ItBXLbMr8%3D'
        run: |
          python - <<'PY'
          import hashlib, io, os, subprocess, sys, tempfile, urllib.request, zipfile
          from pathlib import Path
          with urllib.request.urlopen(os.environ['PACKAGE_URL'], timeout=60) as response:
              content = response.read(500000)
          assert hashlib.sha256(content).hexdigest() == '6d27e210455fef86830cf60641db88d1187d6332db9bfda3f7a8d749677ffb8f', 'Package checksum mismatch'
          with tempfile.TemporaryDirectory() as folder:
              with zipfile.ZipFile(io.BytesIO(content)) as archive:
                  assert set(archive.namelist()) == {'apply_story_update.py', 'page_02.webp'}
                  for name in archive.namelist():
                      Path(folder, name).write_bytes(archive.read(name))
              subprocess.run([sys.executable, str(Path(folder, 'apply_story_update.py'))], check=True)
          PY
      - run: python -m compileall -q streamlit_app.py pages stories tests scripts
      - run: python -m unittest discover -s tests -v
      - name: Export the production reader for review
        run: |
          mkdir -p /tmp/story-identity-review
          python scripts/preview_story.py --output /tmp/story-identity-review/story.html
          cp images/short_stories/rafal/page_02.webp /tmp/story-identity-review/page_02.webp
      - uses: actions/upload-artifact@v7
        with:
          name: story-identity-review
          path: /tmp/story-identity-review/
          retention-days: 7
      - name: Commit the targeted update and remove this temporary workflow
        run: |
          git rm .github/workflows/apply-story-identity-update.yml
          git add stories/rafal_robotic_pinky.json README.md images/short_stories/rafal_robotic_pinky.svg docs/rafal_art_brief.md docs/short_stories.md images/short_stories/rafal/page_02.webp tests/test_story_identity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Rename story and update Mom's page-two portrait"
          git push origin HEAD:refs/heads/fix/robotic-finger-title-mom-hair
