name: Import verified storybook package
on:
  push:
    branches: [feat/cyber-storybook-reader]
    paths: [.github/workflows/import-story-reader.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'raffertyuy/it-must-be-real-website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/cyber-storybook-reader
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Import checksummed source and portraits
        env:
          PACKAGE_URL: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-4504-81f8-ba2a-74ac73533791/raw?se=2026-10-16T06%3A57%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=98d3ff8c-40b9-5e02-8069-ddbac3731a1d&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-16T03%3A07%3A24Z&ske=2026-10-17T03%3A07%3A24Z&sks=b&skv=2026-02-06&sig=OdxIhVlNVbBwgd73c2LSoksrJ16hWXBD0tA6EHa0l2g%3D'
        run: |
          echo "::add-mask::$PACKAGE_URL"
          python - <<'PY'
          import hashlib, io, os, pathlib, urllib.request, zipfile
          expected = 'bd5c1d4c5bd2c79fe762bec224409e7c91b5d1d69c7a600b161f15e40a2727e7'
          with urllib.request.urlopen(os.environ['PACKAGE_URL'], timeout=45) as response:
              data = response.read(5_000_001)
          assert len(data) < 5_000_000 and hashlib.sha256(data).hexdigest() == expected, 'Package checksum mismatch'
          allowed = {'images/short_stories/rafal/' + n + '.webp' for n in ['cover'] + ['page_%02d' % i for i in range(1, 9)]}
          allowed.update(['scripts/preview_story.py', 'stories/book.py', 'stories/frontend/book.css', 'stories/frontend/book.js', '.github/copilot_instructions.md', '.streamlit/config.toml', '.streamlit/stories.css', 'README.md', 'docs/short_stories.md', 'pages/short_stories.py', 'requirements.txt', 'stories/library.py', 'stories/rafal_robotic_pinky.json', 'stories/render.py', 'tests/browser_smoke.py', 'tests/test_stories.py', 'tests/test_story_app.py'])
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert set(archive.namelist()) == allowed
              assert sum(f.file_size for f in archive.infolist()) < 10_000_000
              for name in archive.namelist():
                  path = pathlib.Path(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(archive.read(name))
          print('Imported 26 verified files; no unrelated files changed.')
          PY
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q streamlit_app.py pages stories tests scripts
      - run: python -m unittest discover -s tests -v
      - name: Commit the verified implementation on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/copilot_instructions.md .streamlit README.md docs/short_stories.md images/short_stories/rafal pages/short_stories.py requirements.txt scripts stories tests
          git commit -m 'Build cyber storybook with portrait art, revised family story and animated page turns'
          git push origin HEAD:feat/cyber-storybook-reader
