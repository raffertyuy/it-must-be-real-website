name: Verify deployed story title
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-deployed-title-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install public-page browser check
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect the actual hosted bookshelf and source reference
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright

          expected = json.loads(Path('stories/rafal_robotic_pinky.json').read_text())['title']
          url = 'https://itmustbereal.streamlit.app/short_stories'
          out = Path('title-verification')
          out.mkdir()
          result = {'expected_title': expected, 'url': url, 'frames': [], 'verified': False}
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1080})
              try:
                  page.goto(url, wait_until='domcontentloaded', timeout=60000)
                  page.wait_for_timeout(12000)
                  for frame in page.frames:
                      entry = {'url': urlsplit(frame.url)._replace(query='', fragment='').geturl()}
                      try:
                          entry['headings'] = frame.locator('h1,h2,h3').all_text_contents()
                          if frame.get_by_role('heading', name=expected, exact=True).count():
                              result['verified'] = True
                          source = frame.get_by_role('button', name='source', exact=True)
                          if source.count():
                              try:
                                  with page.expect_popup(timeout=10000) as pending:
                                      source.click()
                                  popup = pending.value
                                  popup.wait_for_timeout(2000)
                                  entry['github_source_url'] = popup.url
                                  popup.close()
                              except Exception as exc:
                                  entry['source_error'] = str(exc)[:400]
                                  entry['source_links'] = frame.locator('a[href*="github.com"]').evaluate_all('(els) => els.map(e => ({text: e.textContent, href: e.href}))')
                          entry['text_excerpt'] = frame.locator('body').inner_text(timeout=5000)[:1800]
                      except Exception as exc:
                          entry['error'] = str(exc)[:300]
                      result['frames'].append(entry)
                  page.screenshot(path=str(out / 'hosted-bookshelf.png'), full_page=True)
              finally:
                  browser.close()
                  (out / 'result.json').write_text(json.dumps(result, indent=2))
                  print(json.dumps(result, indent=2))
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                      f.write('## Hosted deployment inspection\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-story-title
          path: title-verification/
          if-no-files-found: warn
          retention-days: 7
